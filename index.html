<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>HÚSAR TV PLAYER</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#edf2fa;font-family:Arial,sans-serif}
header{height:60px;background:#101a2b;border-bottom:1px solid #263750;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.logo{font-size:21px;font-weight:bold;letter-spacing:1px;color:#48c8ff}
.logo span{color:white}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button,.filebtn{background:#176baf;color:white;border:0;border-radius:6px;padding:10px 13px;font-weight:bold;cursor:pointer}
button:hover,.filebtn:hover{background:#238bdc}
button.secondary{background:#26364c}
button:disabled{opacity:.4}
main{display:grid;grid-template-columns:310px 1fr;height:calc(100vh - 60px)}
aside{background:#101a2b;border-right:1px solid #263750;display:flex;flex-direction:column;min-height:0}
.sidehead{padding:13px;border-bottom:1px solid #263750}
input,select{width:100%;background:#080f1d;color:white;border:1px solid #344761;border-radius:6px;padding:11px;margin-bottom:8px}
#count{font-size:12px;color:#9eb2cb}
#channels{overflow:auto;flex:1}
.channel{padding:12px;border-bottom:1px solid #24334a;cursor:pointer;display:flex;align-items:center;gap:10px}
.channel:hover{background:#1b2d46}
.channel.active{background:#174d75;border-left:4px solid #48c8ff}
.channel img{width:35px;height:35px;object-fit:contain;background:#172338;border-radius:5px}
.channel .name{font-size:14px;font-weight:bold;overflow-wrap:anywhere}
.channel .group{font-size:11px;color:#9eb2cb;margin-top:4px}
.playerarea{padding:18px;display:flex;flex-direction:column;min-width:0}
#screen{background:#000;width:100%;aspect-ratio:16/9;max-height:calc(100vh - 190px);border-radius:9px;object-fit:contain}
#now{font-size:18px;font-weight:bold;margin:14px 0 10px}
