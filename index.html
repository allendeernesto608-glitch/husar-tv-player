
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d18">
<title>HÚSAR IPTV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root {
  --bg:#080d18;
  --panel:#111c2d;
  --accent:#16c7e8;
  --text:#f5f8ff;
  --muted:#9baac0;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
header{
  padding:20px;
  background:#101a2b;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #25354c;
}
.logo{
  font-size:25px;
  font-weight:bold;
  letter-spacing:2px;
}
.logo span{color:var(--accent)}
.status{color:#36d9a0;font-size:12px}
main{padding:16px;max-width:1200px;margin:auto}
h2{font-size:17px;margin:20px 0 12px}
.player{
  background:#000;
  border-radius:13px;
  overflow:hidden;
  border:1px solid #263b55;
}
video{
  width:100%;
  aspect-ratio:16/9;
  display:block;
  background:#000;
}
.controls{
  padding:13px;
  background:#111c2d;
}
button,.file-label{
  border:0;
  border-radius:8px;
  background:#1c3049;
  color:white;
  padding:12px 15px;
  font-size:14px;
  cursor:pointer;
}
button:focus,.file-label:focus{
  outline:2px solid var(--accent);
}
.primary{background:#087f9e}
.controls-row{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}
input{
  width:100%;
  padding:13px;
  border-radius:8px;
  border:1px solid #30445e;
  background:#0d1727;
  color:white;
  font-size:15px;
  margin:7px 0;
}
input[type=file]{display:none}
.file-label{display:inline-block}
.category{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding-bottom:10px;
}
.channel-list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  gap:10px;
}
.channel{
  background:var(--panel);
  border:1px solid #263b55;
  border-radius:10px;
  padding:13px;
  min-height:65px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.channel:focus,.channel:hover{
  border-color:var(--accent);
  background:#19304a;
  outline:none;
}
.channel-name{font-size:14px;overflow-wrap:anywhere}
.favorite{color:#ffd45c;font-size:19px}
.muted{color:var(--muted);font-size:13px}
#message{margin:12px 0;color:var(--accent);font-size:13px}
footer{
  padding:25px;
  text-align:center;
  color:#71839c;
  font-size:12px;
}
@media(min-width:800px){
  main{padding:25px}
  .logo{font-size:30px}
  .channel-list{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
}
</style>
</head>

<body>

<header>
  <div class="logo">HÚSAR <span>IPTV</span></div>
  <div class="status">● LIVE EXPERIENCE</div>
</header>

<main>

<h2>REPRODUCTOR</h2>

<div class="player">
  <video id="video" controls playsinline></video>
  <div class="controls">
    <div class="controls-row">
      <button onclick="toggleFullScreen()">⛶ Pantalla completa</button>
      <button onclick="stopPlayer()">■ Detener</button>
    </div>
  </div>
</div>

<div id="message">Carga tu lista IPTV para comenzar.</div>

<h2>AGREGAR LISTA IPTV</h2>

<input id="playlistUrl" type="url" placeholder="Dirección de lista M3U / M3U8">

<div class="controls-row">
  <button class="primary" onclick="loadUrl()">Cargar URL</button>
  <label class="file-label" for="fileInput">＋ Abrir archivo M3U</label>
  <input id="fileInput" type="file" accept=".m3u,.m3u8,.txt,audio/x-mpegurl,application/vnd.apple.mpegurl">
</div>

<h2>CATEGORÍAS</h2>
<div class="category">
  <button onclick="showCategory('all')">Todos</button>
  <button onclick="showCategory('favorites')">★ Favoritos</button>
</div>

<h2>CANALES DISPONIBLES</h2>
<div id="channels" class="channel-list">
  <p class="muted">Esperando carga de lista...</p>
</div>

<footer>
  HÚSAR IPTV · LIVE EXPERIENCE
  <br>Reproductor personal de listas IPTV
</footer>

</main>

<script>
const video = document.getElementById('video');
const channelsBox = document.getElementById('channels');
const message = document.getElementById('message');

let channels = [];
let favorites = new Set();
let hls = null;
let currentCategory = 'all';

function notify(text){
  message.textContent = text;
}

function parseM3U(text){
  const lines = text.split(/\r?\n/);
  const result = [];
  let current = null;

  for(const line of lines){
    const value = line.trim();
    if(value.startsWith('#EXTINF')){
      const name = value.split(',').pop().trim() || 'Canal sin nombre';
      const group = (value.match(/group-title="([^"]*)"/i)||[])[1] || 'General';
      const logo = (value.match(/tvg-logo="([^"]*)"/i)||[])[1] || '';
      current = {name,group,logo,url:''};
    }else if(value && !value.startsWith('#') && current){
      current.url = value;
      result.push(current);
      current = null;
    }
  }
  return result;
}

function processPlaylist(text){
  const parsed = parseM3U(text);
  if(!parsed.length){
    notify('No se encontraron canales válidos en la lista.');
    return;
  }
  channels = parsed;
  renderChannels();
  notify('Lista cargada correctamente: '+channels.length+' canales.');
}

document.getElementById('fileInput').addEventListener('change', async e=>{
  const file = e.target.files[0];
  if(!file)return;
  try{
    processPlaylist(await file.text());
  }catch(error){
    notify('No se pudo leer el archivo.');
  }
});

async function loadUrl(){
  const url = document.getElementById('playlistUrl').value.trim();
  if(!url)return notify('Introduce una dirección M3U válida.');
  notify('Cargando lista...');
  try{
    const response = await fetch(url);
    if(!response.ok)throw new Error('HTTP '+response.status);
    processPlaylist(await response.text());
  }catch(error){
    notify('No se pudo acceder a la lista. El servidor puede bloquear CORS o el acceso externo. Prueba cargar el archivo local.');
  }
}

function showCategory(category){
  currentCategory = category;
  renderChannels();
}

function renderChannels(){
  channelsBox.innerHTML = '';
  const visible = channels.filter(channel=>{
    if(currentCategory==='favorites')return favorites.has(channel.url);
    return true;
  });

  if(!visible.length){
    channelsBox.textContent='No hay canales en esta categoría.';
    return;
  }

  visible.forEach(channel=>{
    const item=document.createElement('div');
    item.className='channel';
    item.tabIndex=0;

    const name=document.createElement('span');
    name.className='channel-name';
    name.textContent=channel.name;

    const star=document.createElement('button');
    star.className='favorite';
    star.textContent=favorites.has(channel.url)?'★':'☆';
    star.setAttribute('aria-label','Favorito');
    star.onclick=e=>{
      e.stopPropagation();
      if(favorites.has(channel.url))favorites.delete(channel.url);
      else favorites.add(channel.url);
      renderChannels();
    };

    item.append(name,star);
    item.onclick=()=>playChannel(channel);
    item.onkeydown=e=>{
      if(e.key==='Enter'||e.key===' '){
        e.preventDefault();
        playChannel(channel);
      }
    };
    channelsBox.appendChild(item);
  });
}

function playChannel(channel){
  stopPlayer();
  notify('Conectando: '+channel.name);

  if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src=channel.url;
    video.play().catch(()=>notify('Pulsa reproducir para iniciar el canal.'));
  }else if(window.Hls && Hls.isSupported()){
    hls=new Hls({
      enableWorker:true,
      lowLatencyMode:true,
      maxBufferLength:20,
      maxMaxBufferLength:30
    });
    hls.loadSource(channel.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{
      video.play().catch(()=>notify('Pulsa reproducir para iniciar el canal.'));
    });
    hls.on(Hls.Events.ERROR,(event,data)=>{
      if(data.fatal)notify('Error de reproducción. Comprueba la señal o la compatibilidad del canal.');
    });
  }else{
    video.src=channel.url;
    video.play().catch(()=>notify('Formato no compatible con este dispositivo.'));
  }
}

function stopPlayer(){
  if(hls){
    hls.destroy();
    hls=null;
  }
  video.pause();
  video.removeAttribute('src');
  video.load();
}

function toggleFullScreen(){
  const player=document.querySelector('.player');
  if(document.fullscreenElement){
    document.exitFullscreen();
  }else if(player.requestFullscreen){
    player.requestFullscreen();
  }
}
</script>

</body>
</html>
