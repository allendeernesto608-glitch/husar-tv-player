
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HÚSAR IPTV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:white;font-family:Arial,sans-serif}
header{padding:18px;background:#111c30;text-align:center;border-bottom:2px solid #16b8cf}
header h1{margin:0;color:#16d5ed;font-size:27px}
header p{margin:6px;color:#aebbd0}
main{padding:14px;max-width:1100px;margin:auto}
.player{background:#000;border-radius:12px;overflow:hidden}
video{width:100%;height:auto;max-height:65vh;background:#000;display:block}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button,.filebtn{background:#087f9c;color:white;border:0;padding:12px 15px;border-radius:7px;font-weight:bold;cursor:pointer}
button:focus{outline:3px solid white}
input{background:#17243a;color:white;border:1px solid #52647c;padding:12px;border-radius:7px;min-width:0;flex:1}
.import{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.status{color:#20d8e9;padding:8px}
h2{font-size:18px;color:#20d8e9}
.channels{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px}
.channel{background:#17243a;padding:14px;border-radius:8px;text-align:center;cursor:pointer;border:1px solid #31445f;overflow-wrap:anywhere}
.channel:focus,.channel:hover{background:#087f9c;outline:2px solid white}
footer{text-align:center;color:#8292aa;padding:22px}
</style>
</head>
<body>
<header>
<h1>HÚSAR IPTV</h1>
<p>Televisión digital · Tu programación en un solo lugar</p>
</header>

<main>
<div class="player">
<video id="video" controls autoplay playsinline></video>
</div>

<div class="status" id="status">Sistema listo. Carga tu lista de canales.</div>

<h2>AGREGAR LISTA M3U</h2>
<div class="import">
<input type="file" id="file" accept=".m3u,.m3u8,.txt">
<button onclick="loadFile()">ABRIR ARCHIVO</button>
</div>
<div class="import">
<input id="playlistURL" placeholder="Pega aquí el enlace de tu lista M3U">
<button onclick="loadURL()">CARGAR LISTA</button>
</div>

<h2>REPRODUCIR ENLACE</h2>
<div class="import">
<input id="streamURL" placeholder="Enlace directo del canal">
<button onclick="playURL()">REPRODUCIR</button>
</div>

<h2>CANALES DISPONIBLES</h2>
<div class="controls">
<button onclick="previous()">◀ ANTERIOR</button>
<button onclick="next()">SIGUIENTE ▶</button>
<button onclick="toggleFull()">⛶ PANTALLA COMPLETA</button>
</div>
<div class="channels" id="channels"></div>
</main>

<footer>HÚSAR IPTV · Plataforma independiente</footer>

<script>
const video=document.getElementById('video');
const statusBox=document.getElementById('status');
const channelsBox=document.getElementById('channels');
let channels=[];
let current=-1;
let hls=null;

function status(message){
 statusBox.textContent=message;
}

function play(url){
 if(!url)return;
 if(hls){hls.destroy();hls=null;}
 video.pause();
 video.removeAttribute('src');
 video.load();

 if(url.includes('.m3u8') && Hls.isSupported()){
  hls=new Hls();
  hls.loadSource(url);
  hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));
  hls.on(Hls.Events.ERROR,(event,data)=>{
   if(data.fatal)status('No se pudo reproducir este canal.');
  });
 }else{
  video.src=url;
  video.play().catch(()=>status('Pulsa reproducir para iniciar el canal.'));
 }
}

function parseM3U(text){
 const lines=text.split(/\r?\n/);
 const result=[];
 let name='Canal';
 let logo='';
 for(let line of lines){
  line=line.trim();
  if(line.startsWith('#EXTINF')){
   const match=line.match(/,(.*)$/);
   name=match?match[1].trim():'Canal';
   const image=line.match(/tvg-logo="([^"]*)"/);
   logo=image?image[1]:'';
  }else if(line && !line.startsWith('#') &&
           (line.startsWith('http://')||line.startsWith('https://'))){
   result.push({name,url:line,logo});
   name='Canal';logo='';
  }
 }
 return result;
}

function showChannels(){
 channelsBox.innerHTML='';
 channels.forEach((ch,index)=>{
  const item=document.createElement('div');
  item.className='channel';
  item.tabIndex=0;
  item.textContent=ch.name;
  item.onclick=()=>selectChannel(index);
  item.onkeydown=e=>{
   if(e.key==='Enter'||e.key===' '){
    e.preventDefault();selectChannel(index);
   }
  };
  channelsBox.appendChild(item);
 });
 status(channels.length+' canales cargados.');
}

function selectChannel(index){
 if(index<0||index>=channels.length)return;
 current=index;
 play(channels[index].url);
 status('Reproduciendo: '+channels[index].name);
}

function loadFile(){
 const file=document.getElementById('file').files[0];
 if(!file){status('Selecciona un archivo M3U.');return;}
 const reader=new FileReader();
 reader.onload=()=>{
  channels=parseM3U(reader.result);
  showChannels();
 };
 reader.readAsText(file);
}

async function loadURL(){
 const url=document.getElementById('playlistURL').value.trim();
 if(!url){status('Introduce un enlace M3U.');return;}
 status('Cargando lista...');
 try{
  const response=await fetch(url);
  if(!response.ok)throw new Error('Error de acceso');
  channels=parseM3U(await response.text());
  showChannels();
 }catch(e){
  status('No se pudo cargar. Puede existir una restricción CORS o de acceso.');
 }
}

function playURL(){
 const url=document.getElementById('streamURL').value.trim();
 if(url)play(url);
}

function next(){
 if(channels.length)selectChannel((current+1)%channels.length);
}

function previous(){
 if(channels.length)selectChannel((current-1+channels.length)%channels.length);
}

function toggleFull(){
 if(video.requestFullscreen)video.requestFullscreen();
 else if(video.webkitEnterFullscreen)video.webkitEnterFullscreen();
}

document.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight')next();
 if(e.key==='ArrowLeft')previous();
});
</script>
</body>
</html>
