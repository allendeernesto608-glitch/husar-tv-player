
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10252a">
<title>HÚSAR IPTV</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#07131a;color:white;font-family:Arial,sans-serif}
button,input{font-size:16px}
button{cursor:pointer;color:white;background:#18313b;border:1px solid #8d794b;border-radius:9px;padding:12px}
button:focus,input:focus{outline:3px solid #ffd36a}
#home{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#304f48 0%,#77917b 32%,#263d39 55%,#07131b 100%)}
#home:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,transparent 35%,#091923aa 36%),radial-gradient(ellipse at 50% 42%,#f4d38a66,transparent 45%)}
.mountains{position:absolute;bottom:25%;width:100%;height:35%;background:#1d373b;clip-path:polygon(0 100%,18% 25%,30% 75%,48% 0,70% 70%,84% 18%,100% 100%)}
.lake{position:absolute;bottom:16%;height:13%;width:100%;background:linear-gradient(#bca66c77,#152d35)}
.books{position:absolute;bottom:5%;font-size:55px}
#home h1{position:relative;z-index:2;font-size:clamp(40px,8vw,85px);margin:0;color:#fff4d8;text-shadow:0 4px 15px #000;letter-spacing:2px}
#home h1 span{color:#f7c95e}
#home h2{position:relative;z-index:2;color:#ffdc8a;letter-spacing:3px;font-size:clamp(17px,3vw,30px)}
#home p{position:relative;z-index:2}
#enter{position:relative;z-index:3;background:#e6b94e;color:#17130b;font-weight:bold;border:2px solid white;border-radius:30px;padding:16px 28px}
#app{display:none;position:absolute;inset:0;background:#000}
#video{width:100%;height:100%;object-fit:contain;background:#000}
#standby{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(#19343b,#000)}
#standby strong{font-size:36px;color:#f4c75d}
#standby p{color:white}
#bar{position:absolute;top:0;left:0;right:0;padding:12px;background:#07131bcc;display:flex;justify-content:space-between}
#menu{display:none;position:absolute;left:2%;top:8%;bottom:7%;width: min(430px,95%);background:rgba(5,18,28,.95);border:1px solid #b69a5b;border-radius:12px;overflow:hidden;flex-direction:column}
#menu.open{display:flex}
#menu h2{color:#f4c75d;margin:14px}
#search{margin:0 12px 10px;padding:12px;background:#10232c;color:white;border:1px solid #88764d}
#actions{display:flex;flex-wrap:wrap;gap:6px;padding:10px}
#actions button{flex:1;min-width:42%}
#channels{overflow-y:auto;flex:1;padding:5px 10px}
.channel{width:100%;display:block;text-align:left;margin:3px 0;background:#142832;border-color:#33434b}
.channel.sel{background:#775b27;border-color:#ffe09a}
#status{padding:9px;text-align:center;color:#f3d58c;font-size:12px}
#file{display:none}
#notice{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);padding:9px 15px;background:#172832ee;border-radius:20px;z-index:20;white-space:normal;text-align:center;width:max-content;max-width:90%}
</style>
</head>
<body>

<section id="home">
 <div class="mountains"></div><div class="lake"></div>
 <div class="books">📚　📖　🌿</div>
 <h1>HÚSAR <span>IPTV</span></h1>
 <h2>PRESENTE AHORA Y SIEMPRE</h2>
 <p>Tu pantalla · Tu programación</p>
 <button id="enter">ENTRAR A HÚSAR IPTV</button>
</section>

<main id="app">
 <video id="video" controls playsinline></video>
 <div id="standby"><div><strong>HÚSAR IPTV</strong><p>PRESENTE AHORA Y SIEMPRE</p><p>Abre el menú para cargar tu programación</p></div></div>
 <div id="bar"><b>HÚSAR IPTV</b><span id="clock"></span></div>

 <aside id="menu">
  <h2>HÚSAR IPTV</h2>
  <input id="search" placeholder="Buscar canal">
  <div id="actions">
   <button id="load">CARGAR ARCHIVO</button>
   <button id="url">AÑADIR LISTA URL</button>
   <button id="direct">AÑADIR SEÑAL</button>
   <button id="prev">CANAL ANTERIOR</button>
   <button id="next">CANAL SIGUIENTE</button>
   <button id="close">CERRAR MENÚ</button>
  </div>
  <div id="channels"></div>
  <div id="status">0 canales</div>
 </aside>
 <input id="file" type="file" accept=".m3u,.m3u8,.txt">
 <div id="notice">HÚSAR IPTV preparado</div>
</main>

<script>
(function(){
var home=document.getElementById("home");
var app=document.getElementById("app");
var menu=document.getElementById("menu");
var video=document.getElementById("video");
var standby=document.getElementById("standby");
var channelsBox=document.getElementById("channels");
var statusBox=document.getElementById("status");
var notice=document.getElementById("notice");
var channels=[];
var selected=0;
var opened=false;
var currentSearch="";
var storage="husar_iptv_simple";

function say(message){notice.innerHTML=message;}

function save(){
 try{localStorage.setItem(storage,JSON.stringify(channels));}
 catch(e){say("No se pudo guardar la lista en este televisor.");}
}

function restore(){
 try{
  var data=localStorage.getItem(storage);
  if(data){channels=JSON.parse(data)||[];}
 }catch(e){channels=[];}
}

function parse(text){
 var lines=text.replace(/^\uFEFF/,"").split(/\r?\n/);
 var found=[];
 var name="";
 var group="";
 var i,line,comma,match;

 for(i=0;i<lines.length;i++){
  line=lines[i].replace(/^\s+|\s+$/g,"");
  if(!line){continue;}

  if(line.indexOf("#EXTINF:")===0){
   comma=line.lastIndexOf(",");
   name=comma>=0?line.substring(comma+1):"Canal "+(found.length+1);
   match=line.match(/group-title="([^"]*)"/i);
   group=match?match[1]:"Otros";
  }else if(line.indexOf("#")!==0 && /^https?:\/\//i.test(line)){
   found.push({name:name||"Canal "+(found.length+1),url:line,group:group});
   name="";
   group="";
  }
 }
 return found;
}

function draw(){
 channelsBox.innerHTML="";
 var count=0;
 var i,item,button;
 for(i=0;i<channels.length;i++){
  item=channels[i];
  if(currentSearch && item.name.toLowerCase().indexOf(currentSearch)<0){continue;}
  button=document.createElement("button");
  button.className="channel"+(i===selected?" sel":"");
  button.innerHTML="";
  button.appendChild(document.createTextNode((i+1)+". "+item.name));
  button.setAttribute("data-index",i);
  button.onclick=(function(n){return function(){play(n);};})(i);
  channelsBox.appendChild(button);
  count++;
 }
 statusBox.innerHTML=channels.length+" canales · "+count+" visibles";
 if(!count){
  channelsBox.innerHTML="<p style='padding:12px'>Carga una lista M3U o una señal directa.</p>";
 }
}

function showMenu(){
 opened=true;
 menu.className="open";
 draw();
}

function hideMenu(){
 opened=false;
 menu.className="";
}

function enterApp(){
 home.style.display="none";
 app.style.display="block";
 showMenu();
}

function stop(){
 try{video.pause();video.removeAttribute("src");video.load();}
 catch(e){}
 standby.style.display="flex";
}

function play(n){
 if(n<0 || n>=channels.length){return;}
 selected=n;
 var item=channels[n];
 hideMenu();
 stop();
 video.src=item.url;
 video.load();
 standby.style.display="none";
 var result=video.play();
 if(result && result.catch){
  result.catch(function(){say("Canal seleccionado. Pulsa reproducir si no inicia.");});
 }
 say("Canal: "+item.name);
 draw();
}

function change(direction){
 if(!channels.length){showMenu();say("Carga primero una lista.");return;}
 var n=selected+direction;
 if(n<0){n=channels.length-1;}
 if(n>=channels.length){n=0;}
 play(n);
}

document.getElementById("enter").onclick=enterApp;
document.getElementById("load").onclick=function(){
 document.getElementById("file").click();
};
document.getElementById("url").onclick=function(){
 var address=prompt("Pega la dirección web de tu lista M3U:");
 if(address){loadURL(address);}
};
document.getElementById("direct").onclick=function(){
 var address=prompt("Pega la dirección directa de una señal compatible:");
 if(address && /^https?:\/\//i.test(address)){
  channels.push({name:"Señal directa "+(channels.length+1),url:address});
  save();draw();say("Señal añadida.");
 }else if(address){say("Dirección HTTP o HTTPS no válida.");}
};
document.getElementById("prev").onclick=function(){change(-1);};
document.getElementById("next").onclick=function(){change(1);};
document.getElementById("close").onclick=hideMenu;

document.getElementById("file").onchange=function(e){
 var files=e.target.files;
 var i,reader;
 if(!files || !files.length){return;}
 for(i=0;i<files.length;i++){
  reader=new FileReader();
  reader.onload=function(event){
   var items=parse(event.target.result);
   channels=channels.concat(items);
   save();draw();
   say(items.length+" canales añadidos.");
  };
  reader.readAsText(files[i]);
 }
};

function loadURL(address){
 if(!/^https?:\/\//i.test(address)){
  say("La dirección debe comenzar por HTTP o HTTPS.");
  return;
 }
 say("Conectando con la lista...");
 var request=new XMLHttpRequest();
 request.open("GET",address,true);
 request.onreadystatechange=function(){
  if(request.readyState===4){
   if(request.status>=200 && request.status<300){
    var items=parse(request.responseText);
    if(items.length){
     channels=channels.concat(items);
     save();draw();
     say(items.length+" canales añadidos.");
    }else if(/\.m3u8?(\?|$)/i.test(address)){
     channels.push({name:"Lista directa",url:address});
     save();draw();say("Señal añadida.");
    }else{
     say("La lista no contiene canales reconocibles.");
    }
   }else{
    say("El servidor rechazó la solicitud. Puede ser CORS.");
   }
  }
 };
 request.onerror=function(){say("No se pudo acceder al servidor.");};
 request.send(null);
}

document.getElementById("search").oninput=function(){
 currentSearch=this.value.toLowerCase();
 draw();
};

document.addEventListener("keydown",function(e){
 var key=e.key || "";
 var code=e.keyCode || 0;
 var target=e.target;
 var isInput=target && (target.tagName==="INPUT" || target.tagName==="TEXTAREA");

 if(home.style.display!=="none"){
  if(key==="Enter" || code===13){e.preventDefault();enterApp();}
  return;
 }
 if(isInput){return;}

 if(key==="Escape" || key==="Backspace" || code===461){
  e.preventDefault();
  if(opened){hideMenu();}else{showMenu();}
  return;
 }
 if(key==="Enter" || code===13){
  e.preventDefault();
  if(!opened){showMenu();}
  else if(target && target.className==="channel"){play(selected);}
  return;
 }
 if(key==="ArrowUp" || code===38){
  e.preventDefault();
  if(opened){selected=Math.max(0,selected-1);draw();}
  else{change(1);}
  return;
 }
 if(key==="ArrowDown" || code===40){
  e.preventDefault();
  if(opened){selected=Math.min(channels.length-1,selected+1);draw();}
  else{change(-1);}
  return;
 }
 if(key==="ChannelUp" || code===427){change(1);return;}
 if(key==="ChannelDown" || code===428){change(-1);return;}
 if(key==="ArrowLeft" || code===37){
  if(!opened && video.duration && isFinite(video.duration)){
   video.currentTime=Math.max(0,video.currentTime-10);
  }
  return;
 }
 if(key==="ArrowRight" || code===39){
  if(!opened && video.duration && isFinite(video.duration)){
   video.currentTime=Math.min(video.duration,video.currentTime+10);
  }
  return;
 }
});

video.addEventListener("playing",function(){standby.style.display="none";});
video.addEventListener("error",function(){standby.style.display="flex";say("La señal no pudo reproducirse. Revisa formato y servidor.");});

function clock(){
 var d=new Date();
 document.getElementById("clock").innerHTML=
  ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
}
restore();
draw();
clock();
setInterval(clock,10000);
})();
</script>
</body>
</html>
