
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#091820">
<title>HÚSAR IPTV</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#07131b;color:#fff;font-family:Arial,sans-serif}
button,input{font-family:Arial,sans-serif}
button{cursor:pointer;padding:13px;border:1px solid #a98b4b;border-radius:8px;background:#172e37;color:white;font-size:15px}
button:focus,input:focus{outline:3px solid #ffd36a}
#home{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;overflow:hidden;background:linear-gradient(180deg,#456b5b,#9aab84 40%,#294a45 65%,#091820)}
#home:before{content:"";position:absolute;bottom:25%;left:0;width:100%;height:38%;background:linear-gradient(145deg,transparent 20%,#243d3d 21%,#38544a 42%,#172f34 43%);opacity:.9}
#home:after{content:"";position:absolute;bottom:15%;left:0;width:100%;height:12%;background:linear-gradient(#c3b17b,#35534b);opacity:.8}
#brand{z-index:2;font-size:clamp(40px,8vw,86px);font-weight:900;letter-spacing:2px;text-shadow:0 4px 18px #000}
#brand span{color:#ffd16b}
#slogan{z-index:2;color:#ffe09a;font-size:clamp(17px,3vw,30px);font-weight:bold;letter-spacing:3px;margin:18px 5px}
#landscape{z-index:2;font-size:48px;margin:12px}
#enter{z-index:3;background:linear-gradient(110deg,#a87325,#f5d17c);color:#17120a;font-weight:bold;border:2px solid #fff;padding:16px 30px;border-radius:30px;margin-top:20px}
#app{display:none;position:fixed;inset:0;background:#000}
#video{position:absolute;width:100%;height:100%;object-fit:contain;background:#000}
#standby{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(#203b40,#000)}
#standby h1{font-size:clamp(30px,6vw,55px);color:#f5ce72;margin:0}
#standby p{color:#f4e4bd}
#top{position:absolute;top:0;left:0;right:0;padding:13px 18px;background:linear-gradient(#000c,transparent);display:flex;justify-content:space-between}
#top b{color:#f5ce72;letter-spacing:2px}
#menu{display:none;position:absolute;top:5%;bottom:5%;left:2%;width: min(440px,95%);background:rgba(5,18,27,.94);border:1px solid #c09b50;border-radius:12px;overflow:hidden}
#menu.open{display:block}
#menu h2{color:#f5ce72;margin:14px 14px 3px}
#menu .sloganSmall{margin:0 14px 12px;color:#f4dfa9;font-size:12px}
#search{display:block;width:calc(100% - 24px);padding:12px;margin:10px 12px;background:#0d222b;color:#fff;border:1px solid #66777a;border-radius:7px}
#actions{padding:8px 12px;display:flex;flex-wrap:wrap;gap:7px}
#actions button{flex:1;min-width:43%;font-size:12px}
#channels{height:calc(100% - 265px);overflow-y:auto;padding:5px 12px}
.channel{display:block;width:100%;text-align:left;margin:3px 0;background:#152b34;border-color:#344d55}
.channel.selected{background:#775a27;border:2px solid #ffdb83}
#status{padding:8px;text-align:center;color:#f2d58e;font-size:12px}
#notice{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:10;background:#172b35;padding:10px 16px;border-radius:20px;text-align:center;font-size:13px;max-width:90%}
#file{display:none}
@media(max-width:600px){
 #menu{width:96%;left:2%}
 #channels{height:calc(100% - 270px)}
}
</style>
</head>

<body>

<section id="home">
 <div id="brand">HÚSAR <span>IPTV</span></div>
 <div id="slogan">PRESENTE AHORA Y SIEMPRE</div>
 <div id="landscape">📚　🌿　📖</div>
 <button id="enter" onclick="enterApp()">ENTRAR A HÚSAR IPTV</button>
</section>

<main id="app">
 <video id="video" controls playsinline></video>

 <div id="standby">
  <div>
   <h1>HÚSAR IPTV</h1>
   <p>PRESENTE AHORA Y SIEMPRE</p>
   <p>Abre el menú para cargar tus canales</p>
  </div>
 </div>

 <div id="top">
  <b>HÚSAR IPTV</b>
  <span id="clock"></span>
 </div>

 <aside id="menu">
  <h2>HÚSAR IPTV</h2>
  <div class="sloganSmall">PRESENTE AHORA Y SIEMPRE</div>

  <input id="search" type="text" placeholder="Buscar canal">

  <div id="actions">
   <button onclick="document.getElementById('file').click()">CARGAR ARCHIVO</button>
   <button onclick="addPlaylistURL()">AÑADIR LISTA URL</button>
   <button onclick="addDirect()">AÑADIR SEÑAL</button>
   <button onclick="changeChannel(-1)">CANAL ANTERIOR</button>
   <button onclick="changeChannel(1)">CANAL SIGUIENTE</button>
   <button onclick="closeMenu()">CERRAR MENÚ</button>
  </div>

  <div id="channels"></div>
  <div id="status">0 canales disponibles</div>
 </aside>

 <input id="file" type="file" accept=".m3u,.m3u8,.txt" multiple>
 <div id="notice">HÚSAR IPTV preparado</div>
</main>

<script type="text/javascript">
var channels=[];
var selected=0;
var menuOpen=false;
var currentHls=null;
var storageKey="HUSAR_IPTV_LIST";

function el(id){return document.getElementById(id);}

function message(text){el("notice").innerHTML=text;}

function enterApp(){
 el("home").style.display="none";
 el("app").style.display="block";
 openMenu();
}

function openMenu(){
 menuOpen=true;
 el("menu").className="open";
 drawChannels();
}

function closeMenu(){
 menuOpen=false;
 el("menu").className="";
}

function saveChannels(){
 try{
  localStorage.setItem(storageKey,JSON.stringify(channels));
 }catch(e){
  message("No se pudo guardar la lista en este dispositivo.");
 }
}

function restoreChannels(){
 try{
  var saved=localStorage.getItem(storageKey);
  if(saved){
   var data=JSON.parse(saved);
   if(data && data.length){channels=data;}
  }
 }catch(e){
  channels=[];
 }
}

function parsePlaylist(text){
 var lines=text.replace(/^\uFEFF/,"").split(/\r?\n/);
 var result=[];
 var name="";
 var group="";
 var i,line,comma,match;

 for(i=0;i<lines.length;i++){
  line=lines[i].replace(/^\s+|\s+$/g,"");
  if(!line){continue;}

  if(line.indexOf("#EXTINF:")===0){
   comma=line.lastIndexOf(",");
   name=comma>=0?line.substring(comma+1):"Canal "+(result.length+1);
   match=line.match(/group-title="([^"]*)"/i);
   group=match?match[1]:"Otros";
  }else if(line.charAt(0)!=="#" && /^https?:\/\//i.test(line)){
   result.push({
    name:name || "Canal "+(result.length+1),
    url:line,
    group:group
   });
   name="";
   group="";
  }
 }
 return result;
}

function drawChannels(){
 var box=el("channels");
 var query=el("search").value.toLowerCase();
 var html="";
 var i;
 var count=0;

 for(i=0;i<channels.length;i++){
  if(query && channels[i].name.toLowerCase().indexOf(query)<0){
   continue;
  }

  html+='<button class="channel'+(i===selected?' selected':'')+'" onclick="playChannel('+i+')">';
  html+=(i+1)+". "+escapeText(channels[i].name);
  html+='</button>';
  count++;
 }

 if(!count){
  html="<p style='padding:12px'>No hay canales. Carga un archivo M3U o una lista URL.</p>";
 }

 box.innerHTML=html;
 el("status").innerHTML=channels.length+" canales disponibles";
}

function escapeText(text){
 var div=document.createElement("div");
 div.appendChild(document.createTextNode(text));
 return div.innerHTML;
}

function loadFile(file){
 var reader=new FileReader();

 reader.onload=function(){
  var found=parsePlaylist(reader.result);
  if(found.length){
   channels=channels.concat(found);
   saveChannels();
   drawChannels();
   message(found.length+" canales incorporados.");
  }else{
   message("No se encontraron canales M3U en el archivo.");
  }
 };

 reader.onerror=function(){
  message("No se pudo leer el archivo.");
 };

 reader.readAsText(file);
}

el("file").onchange=function(){
 var files=this.files;
 var i;
 for(i=0;i<files.length;i++){
  loadFile(files[i]);
 }
 this.value="";
};

function addPlaylistURL(){
 var address=prompt("Introduce la dirección web de tu lista M3U:");

 if(!address){return;}

 address=address.replace(/^\s+|\s+$/g,"");

 if(!/^https?:\/\//i.test(address)){
  message("La dirección debe comenzar por HTTP o HTTPS.");
  return;
 }

 message("Conectando con el servidor...");

 var xhr=new XMLHttpRequest();
 xhr.open("GET",address,true);

 xhr.onreadystatechange=function(){
  if(xhr.readyState!==4){return;}

  if(xhr.status>=200 && xhr.status<300){
   var found=parsePlaylist(xhr.responseText);

   if(found.length){
    channels=channels.concat(found);
    saveChannels();
    drawChannels();
    message(found.length+" canales cargados.");
   }else if(/\.m3u8?($|\?)/i.test(address)){
    channels.push({name:"Lista directa",url:address});
    saveChannels();
    drawChannels();
    message("Dirección de señal añadida.");
   }else{
    message("La lista no contiene canales reconocibles.");
   }
  }else{
   message("El servidor no permite la descarga. Posible bloqueo CORS.");
  }
 };

 xhr.onerror=function(){
  message("No se pudo conectar con el servidor.");
 };

 xhr.send(null);
}

function addDirect(){
 var address=prompt("Introduce la dirección directa de una señal:");

 if(!address){return;}

 address=address.replace(/^\s+|\s+$/g,"");

 if(!/^https?:\/\//i.test(address)){
  message("Dirección no válida.");
  return;
 }

 channels.push({
  name:"Señal directa "+(channels.length+1),
  url:address,
  group:"Otros"
 });

 saveChannels();
 drawChannels();
 message("Señal añadida.");
}

function loadHls(url){
 if(window.Hls && Hls.isSupported()){
  currentHls=new Hls({
   enableWorker:true,
   lowLatencyMode:true,
   maxBufferLength:20,
   backBufferLength:20
  });

  currentHls.loadSource(url);
  currentHls.attachMedia(el("video"));
  return true;
 }
 return false;
}

function playChannel(index){
 if(index<0 || index>=channels.length){return;}

 selected=index;
 closeMenu();

 var video=el("video");
 var url=channels[index].url;

 video.pause();

 if(currentHls){
  try{currentHls.destroy();}catch(e){}
  currentHls=null;
 }

 video.removeAttribute("src");
 video.load();

 el("standby").style.display="none";
 message("Conectando: "+channels[index].name);

 if(/\.m3u8($|\?)/i.test(url) &&
    !video.canPlayType("application/vnd.apple.mpegurl")){

  if(loadHls(url)){return;}

  var script=document.createElement("script");
  script.src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js";

  script.onload=function(){
   if(!loadHls(url)){
    message("Este navegador no admite esta señal HLS.");
   }
  };

  script.onerror=function(){
   message("No se pudo cargar el reproductor HLS.");
  };

  document.getElementsByTagName("head")[0].appendChild(script);
  return;
 }

 video.src=url;
 video.load();

 var promise=video.play();

 if(promise && promise.catch){
  promise.catch(function(){
   message("Canal seleccionado. Pulsa reproducir.");
  });
 }
}

function changeChannel(direction){
 if(channels.length===0){
  openMenu();
  message("Primero carga una lista de canales.");
  return;
 }

 selected=selected+direction;

 if(selected<0){selected=channels.length-1;}
 if(selected>=channels.length){selected=0;}

 playChannel(selected);
}

el("search").oninput=function(){
 drawChannels();
};

el("video").onplaying=function(){
 el("standby").style.display="none";
};

el("video").onerror=function(){
 el("standby").style.display="flex";
 message("Señal no disponible o formato incompatible.");
};

document.onkeydown=function(e){
 e=e || window.event;
 var key=e.key || "";
 var code=e.keyCode || 0;
 var target=e.target || e.srcElement;

 if(el("home").style.display!=="none"){
  if(key==="Enter" || code===13){
   enterApp();
  }
  return;
 }

 if(target && (target.tagName==="INPUT" || target.tagName==="TEXTAREA")){
  return;
 }

 if(key==="Escape" || key==="Backspace" || code===461){
  if(menuOpen){closeMenu();}
  else{openMenu();}
  return;
 }

 if(key==="Enter" || code===13){
  if(!menuOpen){
   openMenu();
  }else{
   playChannel(selected);
  }
  return;
 }

 if(key==="ArrowUp" || code===38){
  if(menuOpen){
   selected=Math.max(0,selected-1);
   drawChannels();
  }else{
   changeChannel(1);
  }
  return;
 }

 if(key==="ArrowDown" || code===40){
  if(menuOpen){
   selected=Math.min(channels.length-1,selected+1);
   drawChannels();
  }else{
   changeChannel(-1);
  }
  return;
 }

 if(key==="ChannelUp" || code===427){
  changeChannel(1);
  return;
 }

 if(key==="ChannelDown" || code===428){
  changeChannel(-1);
  return;
 }

 if(key==="ArrowLeft" || code===37){
  if(!menuOpen && isFinite(el("video").duration)){
   el("video").currentTime=Math.max(0,el("video").currentTime-10);
  }
  return;
 }

 if(key==="ArrowRight" || code===39){
  if(!menuOpen && isFinite(el("video").duration)){
   el("video").currentTime=Math.min(el("video").duration,el("video").currentTime+10);
  }
  return;
 }
};

function updateClock(){
 var d=new Date();
 var h=("0"+d.getHours()).slice(-2);
 var m=("0"+d.getMinutes()).slice(-2);
 el("clock").innerHTML=h+":"+m;
}

restoreChannels();
drawChannels();
updateClock();
setInterval(updateClock,10000);

</script>
</body>
</html>
